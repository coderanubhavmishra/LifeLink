<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Subtle Glow / Drop Shadow Filter for Tab Clarity -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base Rounded Container for Perfect Visibility on Dark & Light Tabs -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Stylized Blood Drop Outer Shape -->
  <path d="M32 9C32 9 47 25.5 47 37C47 45.28 40.28 52 32 52C23.72 52 17 45.28 17 37C17 25.5 32 9 32 9Z" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Dynamic ECG / Lifeline Pulse Cutout Inside the Drop -->
  <path d="M22 38H27L29.5 33L32.5 43L36 35.5L38.5 38H42" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Small Connection Node (Signifying "Link") -->
  <circle cx="32" cy="23" r="2.5" fill="#E11D48" />
</svg>